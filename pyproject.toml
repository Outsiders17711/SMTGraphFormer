[project]
name = "smtg"
version = "0.1.0"
description = "Pytorch implementation of SMT-GraphFormer: Spatiotemporal Multi-Task Graph Transformer for Transit Prediction"
authors = [{name = "Umar Oluwaleke"}]
readme = "README.md"
requires-python = "==3.12.12"
dependencies = [
    "numpy==2.4.4",
    "matplotlib==3.10.8",
    "pandas==2.3.3",
    "pyarrow==23.0.1",
    "tqdm==4.67.1",
    "torch==2.9.1",
    "torchvision==0.24.1",
    "geopandas==1.1.2",
    "scipy==1.16.3",
    "mapclassify==2.10.0",
    "rtdl-revisiting-models==0.0.2",
    "smtgraphformer",
    "xgboost==3.2.0",
]

[dependency-groups]
dev = [
    "ipykernel==7.1.0",
    "jupyter==1.1.1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
smtgraphformer = { workspace = true, editable = true }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.workspace]
members = [
    "src",
]
